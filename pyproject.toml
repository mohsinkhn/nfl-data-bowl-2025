[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-data-bowl-2025"
version = "0.1.0"
description = "NFL Data Bowl 2025 project for player tracking and prediction"
readme = "README.md"
requires-python = ">=3.12"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
authors = [
    { name = "Mohsin Khan", email = "mhkhan2212@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.2.6",
    "polars>=1.34.0",
    "matplotlib>=3.10.6",
    "plotly>=6.3.1",
    { name = "torch", version = ">=2.4.0", index = "pytorch" },
    { name = "torchvision", version = ">=0.19.0", index = "pytorch" },
    { name = "torchaudio", version = ">=2.4.0", index = "pytorch" },
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

notebook = [
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "notebook>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mohsinkhn/nfl-data-bowl-2025"
Repository = "https://github.com/mohsinkhn/nfl-data-bowl-2025"
Issues = "https://github.com/mohsinkhn/nfl-data-bowl-2025/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]