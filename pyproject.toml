[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-data-bowl-2025"
version = "0.1.0"
description = "NFL Data Bowl 2025 project for player tracking and prediction"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mohsin Khan", email = "mhkhan2212@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==2.3.4",
    "polars==1.34.0",
    "matplotlib==3.10.7",
    "plotly==6.3.1",
    "pandas==2.3.3",
    "torch==2.6.0+cu124",
    "scikit-learn==1.7.2",
    "streamlit>=1.28.0",
    "tqdm>=4.66.0",
    "pyarrow>=14.0.0",
    "pytorch-lightning>=2.0.0",
    "tensorboard>=2.14.0",
    "seaborn>=0.13.2",
    "psutil>=7.1.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "jupyter==1.1.1",
    "ipython==9.6.0",
    "black==25.9.0",
    "flake8==7.3.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
]

notebook = [
    "jupyter==1.1.1",
    "ipython==9.6.0",
    "ipykernel==7.0.1",
    "notebook==7.4.7",
]

[project.urls]
Homepage = "https://github.com/mohsinkhn/nfl-data-bowl-2025"
Repository = "https://github.com/mohsinkhn/nfl-data-bowl-2025"
Issues = "https://github.com/mohsinkhn/nfl-data-bowl-2025/issues"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
